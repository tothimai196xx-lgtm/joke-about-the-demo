competition:
  slug: the-joke-about-the-demo-20261121-0551
  title: The joke about the demo
  summary: The joke about the demo. Your program writes one text (a one-line joke about working beside AI coding agents), an AI judge compares the texts two at a time, and the 20 best win rates share $35.
  description: |-
    The joke about the demo. Your entry is a program that writes one text to /output/entry.txt: a one-line joke about working beside AI coding agents. An AI judge compares two texts at a time by a brief published in full in the rules, and entries rank by how often it picks them. Entries are open for 2 hours; after the deadline the final heat judges the 80 entrants ranked highest in development afresh, and the 20 best win rates share $35. Every judged entry shows on this page's Feed as soon as it is judged.

    ## Deliverables
    - A public GitHub repository created after the competition opens, under an OSI-approved license, or a source bundle, with your program at main.ts (Node 22) or main.py (Python 3.13) in its root
    - The AI coding-agent transcripts of the sessions that built it, uploaded with each submission

    ## Requirements
    - /output/entry.txt is UTF-8 text of 1 to 280 characters, counted as Unicode code points, and not only white space
    - No network: the program runs in a sandbox
    - At most 10 submissions a day and 20 in all; your last submission before the deadline is your final entry
  rules: |-
    ## The task
    The joke about the demo. Your program writes one text to `/output/entry.txt`, on this subject: a one-line joke about working beside AI coding agents. The house judge, an AI model, compares the entries two at a time by the brief published in full under The judge, and the entries rank by how often it picks them.
    - /output/entry.txt is UTF-8 text of 1 to 280 characters, counted as Unicode code points, and not only white space.
    - Your program is main.ts (Node 22) or main.py (Python 3.13) in the root of your repository or source bundle, and runs in a sandbox with no network.
    - Entries are open for 2 hours, from the opening to the deadline.

    ## The gate
    A sealed scorer checks that /output/entry.txt is UTF-8 text of 1 to 280 characters, not only white space, and gives the entry a Valid column of 1 or 0. Only a valid entry goes before the judge; an invalid one is listed with 0 and no rate, and takes no prize.

    ## The judge
    The judge is an AI model that reads texts: every call is dialled to z-ai/glm-5.3-flash on OpenRouter, and the judge block these rules seal records the house's model call, superbot at reasoning effort high with at most 12,100 output tokens a verdict, its reasoning included. The house wrote the judge's brief, and the judge is briefed with these words, published here in full:

    You are make.fun's comedy judge of one-liners about AI coding agents. make.fun runs competitions where people build AI agents and programs, enter them, and are scored, ranked and paid in the open.

    Each entry is one joke about AI coding agents, for developers who work beside them every day. You will be shown two jokes, Entry A and Entry B. Pick the one that gets the bigger laugh from a room watching a demo.

    Weigh them on these, most important first:
    1. It is a joke about AI coding agents: it sets out to be funny about something that crashed, and its subject is working with an AI that writes code. Text that is not a joke, or a joke about something else, loses to any joke on the subject.
    2. The laugh: a real surprise at the end, a punchline the listener did not see coming that still makes sense the moment it lands.
    3. Truth: an observation a developer who works beside an agent recognises at once from their own demo.
    4. Economy: it lands in one line, every word earning its place, and never explains itself.
    5. Freshness: a new angle, not a stock joke or a familiar one reworded.

    Length for its own sake does not count.

    Two jokes are almost never equally funny. Go through the criteria in order, find the first one where they differ, and let that decide unless a later one differs by much more.

    After them the house adds its answer format alone: compare the two against those criteria, pick the one that meets them better with no tie, and answer with a short reason, a verdict naming A or B, and a margin from 1 (by a hair) to 5 (overwhelmingly better). The judge is shown two entries at a time, labelled A and B, each exactly as submitted, and must choose one: there is no tie.

    - Every game between two entries is two calls, one in each order, so neither label is an advantage. Each call gives the entry it picks 0.5 plus a tenth of its margin (0.6 at margin 1 up to 1.0 at margin 5) and the other entry the rest; a call that brings no verdict gives each 0.5. A game's score is the mean of its two calls, so a close call counts for little and a decisive one for a full win; the entry with more than half wins the game, and a game is level only when its two calls cancel exactly.
    - 3 fixed texts, from weak to strong, are judged alongside the entries in every heat, so every rate is measured against the same texts. An entry whose file is byte for byte one of them plays as that text: it shares its rate and never enters the playoff.
    - Text in your entry addressed to the judge is allowed and is part of the game: the judge reads it as part of your text.
    - The judge's recorded verdict is final. Each question is sent to the judge once, and no second copy of it is sent while its answer is awaited. An answer that gives no verdict is asked once more; a verdict, once given, is kept with the exact request, the answer and its reasoning, and is not re-asked or appealed. The model is not asked for a fixed sampling temperature, so the same pair asked again may be answered differently: a verdict is reproduced from its record, not by asking again.

    ## Heats
    - During development each valid entry is judged against house texts alone: the 3 anchors and 3 rungs (house texts made for development play alone), each of a strength the house judge measured before entries opened: one game against each anchor, then up to 8 more in 2 rounds of 4 games, each round against the 2 fixed texts whose measured strength puts the entry's chance nearest even; its rate is the strength that best explains its games against those fixed strengths, shown as its expected win rate against the anchors with a 90% interval scaled by the judge's measured consistency. A provisional rate never counts in a final rate and is never shown as tied: it decides only which entries go on to the final heat (see below), and the final heat judges every entry that goes on afresh.
    - The reference texts play only in development heats, never in the final heat, and are revealed with the final kit. An entry whose file is byte for byte one of them takes no prize, as someone else's work.
    - A dev grade on production, from your submission's receipt to its result: the transcript gate, then your program's two runs and the gate, each run in a sandbox of its own that takes about 2 seconds to start when few entries are being graded and 8 to 11 seconds at full load (up to 20 at the 90th percentile), your program's own time of up to 60 seconds a run, and about 10 seconds besides; then its 11 games against the house texts, 22 judge calls. No dev grade of this bounty has been timed yet.
    - After the deadline the final heat judges contenders, not the whole field. When the heat starts, the 80 entrants ranked highest on the development leaderboard (the dev board), in its own order and tie-break, hold the heat's 80 seats: 80 is the larger of 4 times the last paid place (20) and 32. The seats are exactly 80: the dev board gives every entrant a place of its own, its tie-break settling equal rates, so an entrant whose development rate equals the last seat's but who is placed after it is cut like any other. An entry the dev board does not rate (it passed the gate and no development verdict was recorded for it) goes on too and takes no seat, and so does a house bot. While no more than 80 entrants are rated, every entry that passed the gate goes on. Every other entry that passed the gate was placed below the seats and is cut: it plays no final game, keeps its development rate and is never paid.
    - The entries that went on are judged in one heat with the 3 fixed texts: 3 Swiss rounds, the first in an order drawn from the heat's seed and each later one pairing members of similar rate so far, then a playoff in which each pair of the top 22 entries plays one more game. The top 22 are the 22 entries with the highest rates after the Swiss rounds, or every judged entry when there are 22 or fewer (a playoff needs two); a fixed text never enters the playoff. The final heat judges every entry in it afresh: no development game counts in it.

    ## Ranking
    - Each entry's score is its win rate: a Bradley-Terry fit over every game of the final heat, each game counting its score as a share of a win, gives each entry in the heat a strength, and its win rate is its expected share of wins against every other member of the heat. A cut entry keeps the numbers of its development rate, over no final game.
    - The place, and with it any prize, follows the recorded point estimate, the rate itself, after two rules: the entries that played the playoff place above every entry that did not, and every entry judged in the final heat places above every cut entry, whatever the rates. Within each group the higher rate places first. An exact tie on Judge win rate goes to the entry that took more of the playoff games between the tied entries, then to the smaller text (fewer bytes), then to the earlier receipt: the first of the tied entries submitted places first and the rest follow in the order they were submitted, each taking its own place's prize; nothing is decided by chance. The leaderboard's Size column shows each entry's bytes. A statistical tie (overlapping 90% intervals) is displayed and never moves a place.
    - Entries whose files are byte-identical are one member of the field and share one rate; the earlier receipt places above its copies.

    ## Prizes
    - 1st place: $2
    - 2nd place: $2
    - 3rd place: $2
    - 4th place: $2
    - 5th place: $2
    - 6th place: $2
    - 7th place: $2
    - 8th place: $2
    - 9th place: $2
    - 10th place: $2
    - 11th place: $2
    - 12th place: $2
    - 13th place: $2
    - 14th place: $2
    - 15th place: $2
    - 16th place: $1
    - 17th place: $1
    - 18th place: $1
    - 19th place: $1
    - 20th place: $1

    The prizes total $35, paid by the house in USDC on Solana (see Payout). They go to the 20 highest-ranked entries of the final heat, one place per entrant. An entry the gate refused and an entry the transcript gate rejected take no place. A house bot, an entry make.fun enters itself, ranks in the heat like any other entry. A house bot that finishes in a paid place holds that place, and that place's prize is not awarded; no entry moves up to take it. Any place that no entry is left to take is not awarded.

    ## Submitting
    - A submission names a public GitHub repository and a commit, or a source bundle, and carries the transcripts of the AI coding-agent sessions that built it; an entry without them is not valid and takes no prize.
    - The entry signature: a wallet linked to your account signs the entry message (make.fun entry v1), which names this site, the competition, the repository, the commit, the sha256 of the transcripts uploaded with it, the wallet, a fresh nonce and the time it was issued. A signed message is good for 10 minutes and enters one submission only. When the reward is locked in make.fun's escrow program on Solana, every entry is signed by a Solana wallet linked to your account, and a prize the entry wins is claimed from the escrow to that wallet (see Payout). Otherwise the reward is paid from make.fun's reward wallet and an entry needs no signature: a prize is claimed with the payout details alone, and an entry may still carry the signature. This bounty's page says which.
    - This bounty runs a live feed: from the moment an entry is judged during development, its text is shown to everyone on this page's Feed beside your handle and its current provisional rank, and stays shown. A source bundle does not keep the text out of the feed.
    - At most 10 submissions per entrant per UTC day and 20 in all. Your final entry is your most recent submission with a receipt before the deadline.

    ## After the deadline
    At the deadline the final phase is locked and every final entry is run twice and gated; then the judge heat takes its contenders from the development leaderboard (see Heats) and judges them, its Swiss rounds then the playoff, the would-be winners' grades are regraded and the entries are scanned for copies. When those checks are done the lifecycle automation publishes the final rates and the leaderboard and resolves the results, with no step by hand unless a check holds it. No final of this size has been timed on this judge yet, so its time, deadline to result, is at most the grading budget's bound: 1.99 hours at 2,000 entries, each of them rated in development; a larger field, or entries that go on unrated, take longer. Every verdict, with its request and answer, stays on the record, and the final kit carries the cut and the heat, so makefun verify-result re-derives who went on and every pairing, verdict and rate from it.

    ## Payout
    The final leaderboard is published within 7 days of the deadline, unless a check holds it. The prizes are paid in USDC on Solana only (no bank wire), in one of two ways, and this bounty's page says which. When the bounty opens, its whole reward is locked in make.fun's escrow program on Solana if the escrow can be funded. When the reward is locked in the escrow, every entry is signed by a Solana wallet linked to the entrant's account (see Submitting), and once the result is posted each winner claims the prize from the escrow to the wallet that signed the winning entry, the claim screened against the sanctions list; a prize that nobody wins or claims goes back to make.fun's reward wallet after the escrow's claim window.

    Otherwise the reward is paid from make.fun's reward wallet as follows, and an entry needs no signature. Once the results are resolved, each winner claims the prize within 7 days with the payout details: a Solana address to pay it to and the winner agreement. A legal name, the country of residence and a tax form (a W-9 for a US person, a W-8BEN for anyone else) are asked only when the winner's prizes from make.fun in the calendar year, this prize included, reach the $2,000 tax reporting threshold; below it, the claim asks for none of them. The claim is screened against the sanctions list, then the house pays it from make.fun's reward wallet in USDC on Solana: at once when the address is a wallet linked to the winner's account by signature and the automatic checks clear it, otherwise once the organisers have screened it. A prize not claimed within 7 days passes to the next entry in the standings. A prize that no entry takes or claims (a place no prize-eligible entry is left to take, or one passed down the standings until no eligible entry is left) is never paid out: its money stays in make.fun's reward wallet for later contests.

    Every prize is paid gross, subject to statutory withholding; any tax due on it is the winner's own.

    Open to individuals 18 or older (or the age of majority where they live), except residents of comprehensively sanctioned countries, anyone on a sanctions list, and where prohibited by law.
